name: Deploy Trailer Parks

on:
  push:
    branches: [main, cursor/trailer-parks-platform-8522]
    paths:
      - "trailer-parks/**"
      - ".github/workflows/deploy-trailer-parks.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trailer-parks-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: trailer-parks/package-lock.json

      - name: Install dependencies
        working-directory: trailer-parks
        run: npm ci

      - name: Build for GitHub Pages
        working-directory: trailer-parks
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: trailer-parks/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
