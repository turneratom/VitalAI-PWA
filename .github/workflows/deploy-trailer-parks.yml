name: Deploy Trailer Parks to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "trailer-parks/**"
      - ".github/workflows/deploy-trailer-parks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: trailer-parks/package-lock.json

      - name: Install and build
        working-directory: trailer-parks
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: trailer-parks/out
          publish_branch: gh-pages
          force_orphan: true
