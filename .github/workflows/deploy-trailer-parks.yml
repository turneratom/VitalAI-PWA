name: Deploy Trailer Parks

on:
  push:
    branches: [main]
    paths:
      - "trailer-parks/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "vercel.json"
      - ".github/workflows/deploy-trailer-parks.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Deploy to Vercel
        run: npx vercel deploy --yes --temporary --prod 2>&1 | tee deploy.log

      - name: Extract deployment URL
        run: |
          URL=$(grep -oE 'https://temporary-[a-z0-9-]+\.vercel\.app' deploy.log | head -1)
          echo "DEPLOY_URL=$URL" >> $GITHUB_ENV
          echo "Deployed to: $URL"

      - name: Summary
        run: |
          echo "## Trailer Parks Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Live URL: ${{ env.DEPLOY_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "Owner recruitment: ${{ env.DEPLOY_URL }}/list-your-park" >> $GITHUB_STEP_SUMMARY
          echo "Outreach kit: ${{ env.DEPLOY_URL }}/resources/owners" >> $GITHUB_STEP_SUMMARY
